[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-parasite"
version = "0.2.0"
description = "A bounded cognitive agent harness with semantic and episodic graph memory"
readme = "README.md"
authors = [{name = "vigilanteshit"}]
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "openai>=2,<3", "anthropic>=0.49,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "aiosqlite>=0.20,<1", "neo4j>=5.27,<7", "tiktoken>=0.9,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[project.scripts]
data-parasite = "data_parasite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_parasite"]

[tool.hatch.build.targets.sdist]
only-include = ["src/data_parasite", "tests", "scripts", "docs", "README.md", "LICENSE", "CITATION.cff", "models.toml", ".env.example", "pyproject.toml", "uv.lock"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
