  <text x="134" y="89" class="micro" style="fill:#e5d8f5;letter-spacing:2px">THE DATA PARASITE</text>
  <text x="134" y="134" class="display">The cognitive memory architecture</text>
  <text x="134" y="166" class="body">Industrial knowledge. Recorded experience. <tspan fill="#ecc0ef" font-style="italic">Brighter connections.</tspan></text>

