  <rect x="388" y="795" width="504" height="63" rx="12" fill="#fff" stroke="#b3c6bf"/>
  <text x="640" y="833" text-anchor="middle" class="label">Answer using relevant memory evidence</text>
  <path d="M640 858 V884" class="learn"/>
  <rect x="350" y="890" width="579" height="64" rx="12" fill="#f3eee5" stroke="#d4c3a6"/>
