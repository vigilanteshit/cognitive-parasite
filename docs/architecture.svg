<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">The Data Parasite: cognitive memory architecture</title>
  <desc id="description">Industrial documents enter semantic memory. A supervisor coordinates direct answers and retrieval from semantic and episodic Neo4j knowledge graphs. Semantic memory links chunks to documents and keywords. Episodic memory links experiences to states, states to actions, and earlier versions to successors. Retrieved evidence supports answers. Relevant new user knowledge enters a learning pipeline that scores, categorizes, creates and updates episodic memory. Model profiles, bounded execution and persistent LangGraph checkpoints support the workflow.</desc>
  <defs>
    <linearGradient id="ink" x2="1" y2="1"><stop stop-color="#121b35"/><stop offset=".55" stop-color="#14213b"/><stop offset="1" stop-color="#251c3d"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#584267" stop-opacity=".72"/><stop offset=".45" stop-color="#1c2948"/><stop offset="1" stop-color="#69446c" stop-opacity=".65"/></linearGradient>
    <linearGradient id="semantic" x2="1" y2="1"><stop stop-color="#254568"/><stop offset=".55" stop-color="#172641"/><stop offset="1" stop-color="#473562"/></linearGradient>
    <linearGradient id="episodic" x2="1" y2="1"><stop stop-color="#44304e"/><stop offset=".5" stop-color="#1e284a"/><stop offset="1" stop-color="#573456"/></linearGradient>
    <linearGradient id="rainbow" x2="1"><stop stop-color="#7eacff"/><stop offset=".4" stop-color="#d891f6"/><stop offset=".75" stop-color="#fa91b5"/><stop offset="1" stop-color="#ffce66"/></linearGradient>
    <radialGradient id="hub"><stop stop-color="#9876d0"/><stop offset=".65" stop-color="#286e98"/><stop offset="1" stop-color="#203851"/></radialGradient>
    <radialGradient id="gold"><stop stop-color="#6f5436"/><stop offset="1" stop-color="#273149"/></radialGradient>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3.5" fill="#080e21"/></pattern>
    <pattern id="blue-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="4" fill="#58a0ff" opacity=".38"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8acff2"/></marker>
    <marker id="gold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#ffd079"/></marker>
    <symbol id="document" viewBox="0 0 32 32"><path d="M8 4h11l6 6v18H8Z M19 4v7h6 M12 16h9 M12 21h9"/></symbol>
    <symbol id="book" viewBox="0 0 32 32"><path d="M16 7c-4-3-8-3-13-2v21c5-1 9-1 13 2 4-3 8-3 13-2V5c-5-1-9-1-13 2Z M16 7v21"/></symbol>
    <symbol id="hash" viewBox="0 0 32 32"><path d="M12 4 8 28 M24 4 20 28 M4 12h25 M3 22h25"/></symbol>
    <symbol id="state" viewBox="0 0 32 32"><path d="m16 4 13 23H3Z M16 12v7 M16 23v1"/></symbol>
    <symbol id="action" viewBox="0 0 32 32"><path d="m6 25 12-12a9 9 0 0 1 0-8l4 5 5-2c1 6-3 10-8 9L9 28Z"/></symbol>
    <symbol id="history" viewBox="0 0 32 32"><path d="M6 12a12 12 0 1 1 0 10 M6 4v9h9 M16 9v8l5 3"/></symbol>
    <symbol id="brain" viewBox="0 0 32 32"><path d="M16 5c-4-4-9-1-9 3-5 0-7 7-3 10-3 5 1 10 6 9 0 4 6 3 6-1Zm0 0c4-4 9-1 9 3 5 0 7 7 3 10 3 5-1 10-6 9 0 4-6 3-6-1Z M7 8l4 3 M4 18h5l3 4 M25 8l-4 3 M28 18h-5l-3 4 M16 12l-4 4 M16 17l4 4"/></symbol>
    <style>
      text {font-family:'Segoe UI',Arial,sans-serif;fill:#f4f1ff}
      .display {font-family:Georgia,'Times New Roman',serif;font-size:52px;font-weight:700;letter-spacing:-1px}
      .heading {font-size:31px;font-weight:600;letter-spacing:-.5px}
      .label {font-size:23px;font-weight:600}
      .body {font-size:19px;fill:#e1d9ef}
      .small {font-size:16px;fill:#cdc5df}
      .micro {font-size:13px;fill:#b9c6e9;letter-spacing:.5px}
      .edge {fill:none;stroke:#8acff2;stroke-width:2.4;marker-end:url(#arrow)}
      .learn {fill:none;stroke:#ffd079;stroke-width:2.6;marker-end:url(#gold-arrow)}
      .panel {stroke:#d0bbef;stroke-opacity:.4;stroke-width:1.2}
      .icon {fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

