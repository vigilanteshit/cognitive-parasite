  <text x="640" y="276" text-anchor="middle" style="fill:#dfebe3;font-size:18px">Direct answer · semantic retrieval · episodic retrieval</text>
  <rect x="61" y="215" width="263" height="83" rx="12" fill="#fff" stroke="#a8c3b6"/>
