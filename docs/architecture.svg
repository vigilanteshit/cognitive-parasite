<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="title description">
  <title id="title">Cognitive architecture for industrial knowledge retention</title>
  <desc id="description">A supervisor retrieves evidence from two Neo4j knowledge graphs. Semantic memory connects document chunks, documents and keywords. Episodic memory connects experiences, states, actions and successive versions. Answers use retrieved evidence; the learning pipeline scores and categorizes new user knowledge and writes it to episodic memory. Model profiles and bounded execution support the workflow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526967"/></marker>
    <marker id="learning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9d642d"/></marker>
    <style>
      text {font-family:Arial,Helvetica,sans-serif; fill:#183330}
      .heading {font-size:28px; font-weight:700}
      .label {font-size:21px; font-weight:700}
      .body {font-size:19px}
      .small {font-size:17px; fill:#526967}
      .edge {fill:none; stroke:#526967; stroke-width:2.5; marker-end:url(#arrow)}
      .learn {fill:none; stroke:#9d642d; stroke-width:2.5; marker-end:url(#learning-arrow)}
      .node {fill:#fff; stroke:#b3c6bf; stroke-width:1.5}
    </style>
  </defs>
  <rect width="1280" height="1010" rx="20" fill="#f7f9f5"/>
